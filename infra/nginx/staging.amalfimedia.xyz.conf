# NEW server block for staging. Do not edit the amalfimedia.xyz public site.

upstream amalfi_staging {
    server 127.0.0.1:3101;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.amalfimedia.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.amalfimedia.xyz;

    ssl_certificate     /etc/letsencrypt/live/staging.amalfimedia.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.amalfimedia.xyz/privkey.pem;

    client_max_body_size 512m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /internal-media/ {
        internal;
        alias /var/lib/amalfi/staging/media/;
    }

    location / {
        proxy_pass http://amalfi_staging;
        include /etc/nginx/snippets/amalfi-proxy.conf;
    }
}
