# NEW server block for the platform. Do not edit the amalfimedia.xyz public site.
# Install as /etc/nginx/sites-available/app.amalfimedia.xyz and enable that file only.

upstream amalfi_production {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.amalfimedia.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.amalfimedia.xyz;

    ssl_certificate     /etc/letsencrypt/live/app.amalfimedia.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.amalfimedia.xyz/privkey.pem;

    client_max_body_size 512m;

    location /internal-media/ {
        internal;
        alias /var/lib/amalfi/production/media/;
    }

    location / {
        proxy_pass http://amalfi_production;
        include /etc/nginx/snippets/amalfi-proxy.conf;
    }
}
