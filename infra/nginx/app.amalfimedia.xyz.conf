# Future VPS only. Do not install this until production deploy is approved.
# This is a NEW server block. Do not edit the existing amalfimedia.xyz
# server block, its root, or its public-site locations.

upstream amalfi_platform {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.amalfimedia.xyz;

    # ssl_certificate     /etc/letsencrypt/live/app.amalfimedia.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.amalfimedia.xyz/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://amalfi_platform;
        include /etc/nginx/snippets/amalfi-proxy.conf;
    }
}

# Staging on the same VPS later would be a second server block:
# server_name staging.amalfimedia.xyz;
# proxy_pass http://127.0.0.1:3101;
# Its database, bucket, and Stripe keys stay separate from production.
