# Render blueprint for isolated staging. Secrets are sync:false so Render asks for them.
# Do not point DATABASE_URL or S3_BUCKET at production.
services:
  - type: web
    name: amalfi-media-staging
    runtime: node
    plan: starter
    branch: develop
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    preDeployCommand: pnpm exec prisma migrate deploy && pnpm db:seed
    healthCheckPath: /portal/api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: APP_ENV
        value: staging
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: EMAIL_MARKETING_ENABLED
        value: "false"
      - key: EMAIL_TRANSACTIONAL_ENABLED
        value: "false"
      - key: EMAIL_DEV_PREVIEW
        value: "false"
      - key: STAGING_BASIC_AUTH
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
